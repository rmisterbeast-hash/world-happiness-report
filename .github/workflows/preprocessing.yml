name: Verify data preprocessing notebook
on:
  push:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'data/*.json'
      - 'scripts/verify_preprocessing.py'
      - '.github/workflows/preprocessing.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: python -m pip install "pandas>=2.2,<3"
      - name: Rerun Colab-compatible notebook, validate outputs
        run: python scripts/verify_preprocessing.py
