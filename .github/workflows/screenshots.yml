name: Capture verified website screenshots
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_screenshots.cjs'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start web server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/whr-screen-server.log 2>&1 &
          sleep 2
      - name: Capture actual site, check responsive overflow and JS errors
        run: node scripts/capture_screenshots.cjs
      - name: Save verified screenshots to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if ! git diff --staged --quiet; then
            git commit -m "Document visual appearance at mobile, tablet and desktop widths"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots
          path: docs/screenshots/
          retention-days: 30
